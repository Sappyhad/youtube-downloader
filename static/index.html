<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YT Downloader</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #e8eaf0;
      --muted: #8a91a3; --accent: #ff3b3b; --ok: #3ccf7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: min(560px, 100% - 32px); }
    h1 { font-size: 22px; margin: 0 0 20px; letter-spacing: -0.01em; }
    h1 span { color: var(--accent); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    input[type=url] {
      width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--bg); color: var(--text); font-size: 15px;
    }
    input[type=url]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .formats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
    .formats input { display: none; }
    .formats label {
      border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer;
    }
    .formats label b { display: block; font-size: 16px; }
    .formats label small { color: var(--muted); font-size: 12px; }
    .formats input:checked + label { border-color: var(--accent); background: #ff3b3b14; }
    button {
      width: 100%; padding: 12px; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 16px; min-height: 22px; color: var(--muted); word-break: break-word; }
    #status.error { color: var(--accent); }
    #status.done { color: var(--ok); }
    .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; display: none; }
    .bar div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  </style>
</head>
<body>
<main>
  <h1><span>&#9654;</span> YT Downloader</h1>
  <form class="panel" id="form">
    <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." required autofocus>
    <div class="formats">
      <input type="radio" name="format" id="f-mp4" value="mp4" checked>
      <label for="f-mp4"><b>MP4</b><small>wideo do 1080p</small></label>
      <input type="radio" name="format" id="f-mp3" value="mp3">
      <label for="f-mp3"><b>MP3</b><small>audio 320 kbps</small></label>
      <input type="radio" name="format" id="f-wav" value="wav">
      <label for="f-wav"><b>WAV</b><small>audio bezstratne</small></label>
    </div>
    <button id="go">Pobierz</button>
    <div class="bar" id="bar"><div></div></div>
    <div id="status"></div>
  </form>
</main>
<script>
  const form = document.getElementById("form");
  const statusEl = document.getElementById("status");
  const bar = document.getElementById("bar");
  const button = document.getElementById("go");
  const LABELS = { queued: "W kolejce…", downloading: "Pobieranie", processing: "Łączenie / konwersja…" };

  function setStatus(text, kind = "") {
    statusEl.textContent = text;
    statusEl.className = kind;
  }

  function setProgress(percent) {
    bar.style.display = percent == null ? "none" : "block";
    bar.firstElementChild.style.width = `${percent ?? 0}%`;
  }

  async function poll(jobId) {
    const res = await fetch(`/api/status/${jobId}`);
    const job = await res.json();
    if (job.status === "done") {
      setProgress(100);
      const details = job.resolution ? ` (${job.resolution})` : "";
      setStatus(`Gotowe: ${job.title}${details}`, "done");
      window.location.href = `/api/file/${jobId}`;
      button.disabled = false;
      return;
    }
    if (job.status === "error") {
      setProgress(null);
      setStatus(`Błąd: ${job.error}`, "error");
      button.disabled = false;
      return;
    }
    setProgress(job.percent ?? 0);
    const pct = job.status === "downloading" && job.percent != null ? ` ${job.percent}%` : "";
    setStatus(LABELS[job.status] + pct);
    setTimeout(() => poll(jobId), 700);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    button.disabled = true;
    setProgress(0);
    setStatus("Start…");
    try {
      const res = await fetch("/api/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          url: document.getElementById("url").value,
          format: form.elements.format.value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      poll(data.job_id);
    } catch (err) {
      setProgress(null);
      setStatus(`Błąd: ${err.message}`, "error");
      button.disabled = false;
    }
  });
</script>
</body>
</html>
